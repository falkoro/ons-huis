<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ons Huis Interieur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: full-bleed 3D canvas; floating control rail top-left, material panel on the right (bottom sheet on phones) */
:root{
  --bg:#e7ebe6; --surface:#f7f8f5; --surface-2:#edf0eb; --ink:#1b231f; --ink-2:#56625b; --line:#d0d7cf;
  --accent:#2d5a4c; --accent-ink:#f3f7f4; --brass:#9a7531; --glass:rgba(247,248,245,.88);
  --shadow:0 12px 32px rgba(27,35,31,.16); --focus:#2d5a4c;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1412; --surface:#18201c; --surface-2:#1f2924; --ink:#e3eae5; --ink-2:#9aa89f; --line:#2d3833;
    --accent:#8cc5ae; --accent-ink:#0d1411; --brass:#d3ae63; --glass:rgba(21,28,25,.88);
    --shadow:0 12px 32px rgba(0,0,0,.45); --focus:#8cc5ae; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#18201c; --surface-2:#1f2924; --ink:#e3eae5; --ink-2:#9aa89f; --line:#2d3833;
  --accent:#8cc5ae; --accent-ink:#0d1411; --brass:#d3ae63; --glass:rgba(21,28,25,.88);
  --shadow:0 12px 32px rgba(0,0,0,.45); --focus:#8cc5ae; color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- top rail ---------- */
#topbar{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;
  max-width:min(560px,calc(100vw - 32px));z-index:5;pointer-events:none}
#topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:var(--r);padding:8px 14px 8px 10px;box-shadow:var(--shadow);width:max-content;max-width:100%}
.brand svg{flex:none}
.brand h1{font:700 18px/1.1 var(--font-display);letter-spacing:-.01em;margin:0}
.brand p{margin:2px 0 0;font:500 11px/1.2 var(--font-mono);color:var(--ink-2);letter-spacing:.02em}
.seg{display:inline-flex;gap:2px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow);max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;white-space:nowrap;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.scroll{overflow-x:auto;scrollbar-width:none;max-width:100%}
@media (max-width:760px){.seg .lg{display:none}}
.seg.scroll::-webkit-scrollbar{display:none}
.rail-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jump{display:inline-flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 14px;box-shadow:var(--shadow)}
.jump span{font:500 11px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.jump select{border:0;background:var(--surface);border-radius:999px;padding:6px 10px;font-weight:500;max-width:52vw}

/* ---------- panel ---------- */
#panel{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:340px;z-index:6;
  display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.handle{display:none}
.panel-body{overflow-y:auto;overscroll-behavior:contain;padding:6px 18px 18px;display:flex;flex-direction:column}
.panel-body section{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.panel-body section:last-child{border-bottom:0}
.eyebrow,h3{font:500 11px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:0}
h2{font:700 24px/1.1 var(--font-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.selrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mono{font:500 12px/1.2 var(--font-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.panel-body select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px}
.seg.small{box-shadow:none;background:var(--surface-2);width:100%;display:flex}
.seg.small button{flex:1;padding:6px 8px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.chip i{display:inline-flex;gap:0;border-radius:999px;overflow:hidden;height:12px;width:30px;border:1px solid var(--line)}
.chip i b{flex:1}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:4px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.tile canvas{width:100%;aspect-ratio:1.6;border-radius:5px;display:block;max-width:100%}
.tile span{font-size:12px;line-height:1.2;font-weight:500;padding:0 2px 2px;overflow-wrap:anywhere}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.swatches.small{grid-template-columns:repeat(8,minmax(0,1fr))}
.sw{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.18);padding:0;position:relative;max-width:100%}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent)}
.sub{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.sub .lbl{font-weight:600;color:var(--ink)}
input[type=color]{width:38px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px;cursor:pointer}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 9px;font-size:13px;min-width:0}
.check input{accent-color:var(--accent);margin:0;flex:none}
.check span{overflow-wrap:anywhere}
.empty{font-size:13px;color:var(--ink-2);margin:0}
.time{display:flex;align-items:center;gap:10px}
.time input{flex:1;accent-color:var(--accent);min-width:0}
.time output{font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;width:46px;text-align:right}
.ticks{display:flex;gap:6px;flex-wrap:wrap}
.ticks button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px}
.foot{flex-direction:row!important;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:12px;color:var(--ink-2);margin:0}

/* ---------- overlays ---------- */
#hint{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;max-width:min(520px,calc(100vw - 390px));
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 12px;font-size:12.5px;color:var(--ink-2);box-shadow:var(--shadow)}
#hint kbd{font:500 11px/1 var(--font-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--surface);color:var(--ink)}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:3;pointer-events:none}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px rgba(0,0,0,.6)}
#cross::before{left:8px;top:2px;width:2px;height:14px}
#cross::after{top:8px;left:2px;height:2px;width:14px}
#tag{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
  font:500 12px/1 var(--font-body);padding:5px 9px;border-radius:999px;white-space:nowrap;opacity:.92}
#roomTag{position:absolute;left:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:3;pointer-events:none; /* stacked above #hint */
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--ink);
  font:600 13px/1 var(--font-body);letter-spacing:.01em;padding:7px 14px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow)}
#joy{position:absolute;left:24px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;z-index:5;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(0,0,0,.25)}
#walkStart{position:absolute;inset:0;z-index:4;display:grid;place-items:end center;padding-bottom:20vh;box-sizing:border-box;pointer-events:none}
#walkStart button{pointer-events:auto;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:999px;padding:12px 22px;box-shadow:var(--shadow)}
#loading{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:var(--bg);font:500 13px var(--font-mono);color:var(--ink-2);letter-spacing:.06em}

/* ---------- phone: bottom sheet ---------- */
@media (max-width:760px){
  #topbar{right:16px;max-width:none;gap:8px}
  .brand{padding:6px 12px 6px 8px}
  .brand h1{font-size:16px}
  .brand p{display:none}
  .seg button{padding:6px 11px;font-size:13px}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:64vh;border-radius:18px 18px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom,0px);transition:max-height .25s ease}
  #panel.collapsed{max-height:calc(58px + env(safe-area-inset-bottom,0px))}
  #panel.collapsed .panel-body{overflow:hidden}
  .handle{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 16px 8px;width:100%;flex-direction:column}
  .handle .grip{width:40px;height:4px;border-radius:2px;background:var(--line)}
  .handle .ht{font:600 14px var(--font-body);display:flex;gap:8px;align-items:baseline}
  .handle .ht small{font:500 11px var(--font-mono);color:var(--ink-2)}
  .panel-body{padding:0 16px 16px}
  #hint{display:none}
  #roomTag{left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  #walkStart{padding-bottom:28vh}
  #joy{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){ #panel{transition:none} }
</style>

<div id="app">
  <div id="stage"></div>

  <header id="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="var(--accent)"/><path d="M7 21V13.5L15 7l8 6.5V21h-5.5v-5h-5v5z" fill="var(--accent-ink)"/></svg>
      <div><h1>Ons Huis</h1><p>INTERIEURPLANNER · 3 LAGEN · 9,2 × 12,5 M</p></div>
    </div>
    <div class="rail-row">
      <div class="seg" role="group" aria-label="Weergave">
        <button id="btnDoll" aria-pressed="true">Poppenhuis</button>
        <button id="btnWalk" aria-pressed="false">Rondlopen</button>
      </div>
      <label class="jump" for="roomJump"><span>Kamer</span><select id="roomJump"></select></label>
    </div>
    <div class="seg scroll" id="floorSeg" role="group" aria-label="Verdieping">
      <button data-floor="0" aria-pressed="true">Begane grond</button>
      <button data-floor="1" aria-pressed="false">1e<span class="lg"> verdieping</span></button>
      <button data-floor="2" aria-pressed="false">2e <span class="lg">verdieping (</span>zolder<span class="lg">)</span></button>
      <button data-floor="out" aria-pressed="false">Buiten</button>
    </div>
  </header>

  <aside id="panel" aria-label="Aanpassen">
    <button id="sheetHandle" class="handle" aria-expanded="true" aria-controls="panelBody"><span class="grip"></span><span class="ht"><span id="sheetRoom">Woonkamer</span><small>aanpassen</small></span></button>
    <div class="panel-body" id="panelBody">
      <section>
        <div class="eyebrow">Selectie</div>
        <div class="selrow"><h2 id="selName">Woonkamer</h2><span id="selMeta" class="mono"></span></div>
        <select id="roomSelect" aria-label="Kamer kiezen"></select>
        <div class="seg small" role="group" aria-label="Toepassen op" id="scopeSeg">
          <button data-scope="room" aria-pressed="true">Kamer</button>
          <button data-scope="floor" aria-pressed="false">Hele verdieping</button>
          <button data-scope="house" aria-pressed="false">Hele huis</button>
        </div>
      </section>
      <section>
        <h3>Stijl</h3>
        <div id="styles" class="chips"></div>
        <p class="note">Een stijl zet muren, vloeren en meubels in één keer.</p>
      </section>
      <section>
        <h3>Vloer</h3>
        <div id="floorTiles" class="tiles"></div>
        <div class="sub"><span>Tint <span class="lbl" id="tintName">Naturel</span></span><input type="color" id="tintPick" aria-label="Eigen tint"></div>
        <div id="tints" class="swatches small"></div>
      </section>
      <section>
        <h3>Muurkleur</h3>
        <div id="wallSw" class="swatches"></div>
        <div class="sub"><span class="lbl" id="wallName">Gebroken wit</span><input type="color" id="wallPick" aria-label="Eigen muurkleur"></div>
      </section>
      <section>
        <h3>Inrichting</h3>
        <div id="items" class="checks"></div>
        <div class="sub"><span>Kleed</span></div>
        <div id="rugSw" class="swatches small"></div>
      </section>
      <section>
        <h3>Licht</h3>
        <div class="time"><input type="range" id="tod" min="6" max="24" step="0.25" aria-label="Tijd van de dag"><output id="todOut" for="tod">13:00</output></div>
        <div class="ticks" id="todTicks"><button data-h="8.5">Ochtend</button><button data-h="13.5">Middag</button><button data-h="19.25">Avond</button><button data-h="23">Nacht</button></div>
      </section>
      <section class="foot">
        <button class="btn" id="btnReset">Alles terugzetten</button>
        <span id="resetConfirm" hidden><button class="btn primary" id="resetYes">Ja, terugzetten</button> <button class="btn" id="resetNo">Annuleren</button></span>
        <p class="note" style="flex-basis:100%">Keuzes worden in deze browser bewaard.</p>
      </section>
    </div>
  </aside>

  <div id="hint"></div>
  <div id="cross" hidden></div>
  <div id="tag" hidden></div>
  <div id="roomTag" hidden aria-live="polite"></div>
  <div id="joy" hidden><div id="joyKnob"></div></div>
  <div id="walkStart" hidden><button id="btnLook">Klik om rond te kijken</button></div>
  <div id="loading">HUIS WORDT OPGEBOUWD…</div>
</div>

<script type="importmap">

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const $ = s => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
const isPhone = () => innerWidth <= 760;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* ================= HOUSE DATA (metres; see SPEC: X left→right, Z back→front, Y up) ================= */
const LV = [
  { id: 0, name: 'Begane grond', floor: 0, ceil: 2.51, top: 2.76 },
  { id: 1, name: '1e verdieping', floor: 2.76, ceil: 5.14, top: 5.39 },
  { id: 2, name: '2e verdieping (zolder)', floor: 5.39, ceil: 8.02, top: 8.02 },
];
const LVSHORT = ['BG', '1e', '2e'];
// main block pitched roof (outer surface), ridge along X
const MR_Z = 8.23, MR_Y = 9.3, MR_K = 0.9;
const mainOut = z => MR_Y - Math.abs(z - MR_Z) * MR_K;
const mainIn = z => mainOut(z) - 0.3;
const COLLAR = 8.02;
const atticTop = z => Math.min(COLLAR, mainIn(z));
const ATTIC_BRK = [MR_Z - (MR_Y - 0.3 - COLLAR) / MR_K, MR_Z, MR_Z + (MR_Y - 0.3 - COLLAR) / MR_K];
// left wing pitched roof
const WR_Z = 3.92, WR_Y = 6.2, WR_K = 0.82;
const wingOut = z => WR_Y - Math.abs(z - WR_Z) * WR_K;
const wingIn = z => wingOut(z) - 0.28;

const ROOMS = [
  { id: 'woonkamer', name: 'Woonkamer', lvl: 0, rects: [[3.72, 6.57, 0, 4.05], [3.25, 7.0, 4.05, 12.25], [7.0, 9.0, 4.05, 7.58]], spawn: [5.3, 11.4, 0.15] },
  { id: 'keuken', name: 'Keuken', lvl: 0, rects: [[6.63, 9.0, 0, 3.95]], spawn: [7.0, 2.9, -0.9] },
  { id: 'zitkamer', name: 'Zitkamer', lvl: 0, rects: [[0, 3.62, 0, 3.8], [0, 3.0, 3.8, 7.73]], spawn: [2.3, 6.9, 0.25] },
  { id: 'entree', name: 'Entree', lvl: 0, rects: [[7.07, 8.24, 7.72, 12.25], [8.24, 9.0, 8.82, 12.25]], spawn: [7.6, 11.5, 0] },
  { id: 'wc1', name: 'Toilet (achter)', lvl: 0, rects: [[0, 0.91, 7.8, 9.06]], wet: true, spawn: [0.45, 8.3, 0] },
  { id: 'achterhal', name: 'Achterhal', lvl: 0, rects: [[0.97, 3.0, 7.8, 9.06]], spawn: [2.3, 8.5, 1.57] },
  { id: 'wc2', name: 'Toilet (entree)', lvl: 0, rects: [[8.24, 9.0, 7.72, 8.82]], wet: true, spawn: [8.6, 8.4, 0] },
  { id: 'sk1', name: 'Slaapkamer 1', lvl: 1, rects: [[3.25, 6.59, 4.21, 8.13], [3.25, 6.97, 8.13, 9.18]], spawn: [6.2, 8.7, 0.75] },
  { id: 'badkamer', name: 'Badkamer', lvl: 1, rects: [[6.68, 9.0, 4.21, 8.13]], wet: true, spawn: [7.4, 7.7, -0.3] },
  { id: 'overloop', name: 'Overloop', lvl: 1, rects: [[7.03, 8.16, 8.23, 10.34]], spawn: [7.6, 9.4, 1.57] },
  { id: 'sk2', name: 'Slaapkamer 2', lvl: 1, rects: [[3.25, 6.97, 9.28, 12.25]], spawn: [6.4, 9.8, 2.3] },

/* ================= UI PANEL ================= */
let flash = null;

  const tn = TINTS.find(p => p[1] === rs.tint.toLowerCase()); $('#tintName').textContent = tn ? tn[0] : 'Eigen tint';
  $('#tints').replaceChildren(...TINTS.map(([n, h]) => swatch(h, n, h === rs.tint.toLowerCase(), () => applyToTargets(s => { s.tint = h; }))));

    c.onchange = () => { rs.items[iid] = c.checked; buildRoomFurniture(r.id); saveState(); };

}
function buildPanel() {
  const jumpSel = $('#roomJump'); jumpSel.append(new Option('Ga naar…', ''));

  };

  document.querySelectorAll('#floorSeg button').forEach(b => b.onclick = () => setView(b.dataset.floor === 'out' ? 'out' : +b.dataset.floor));

  refreshStyleMaterials(); ROOMS.forEach(r => refreshRoomMaterials(r.id)); buildAllFurniture(); saveState(); syncPanel();
}

/* ================= PUBLIC HOOK FOR ADD-ON MODULES ================= */
const tickFns = new Set();
window.HOUSE = {
  scene, THREE, camera, renderer,
  floors: LV.map(l => ({ ...l, y: l.floor })),
  rooms: ROOMS.map(r => ({ id: r.id, name: r.name, level: r.lvl, floorY: LV[r.lvl].floor, rects: r.rects.map(q => ({ x0: q[0], x1: q[1], z0: q[2], z1: q[3] })) })),
  addToRoom(roomId, obj) { const r = ROOM[roomId]; (r ? G[r.lvl].main : EXT).add(obj); return obj; },
  onTick(fn) { tickFns.add(fn); return () => tickFns.delete(fn); },
  roomAt: (level, x, z) => roomAt(level, x, z)?.id || null,
  colliders, doors, get mode() { return mode; }, get view() { return view; },
};
// API used by modules/ (measure, shopping, vr): house data, state + change events, walker, toolbar and toasts
{
  const H = window.HOUSE, subs = { change: new Set(), room: new Set() };
  const emit = (k, ...a) => { for (const f of subs[k]) { try { f(...a); } catch (e) { console.error(e); } } };
  const _save = saveState; saveState = function () { _save(); emit('change', state); };
  const _sel = selectRoom; let lastSel = state.sel; selectRoom = function (id) { _sel(id); if (state.sel !== lastSel) { lastSel = state.sel; emit('room', id); } };
  Object.defineProperty(H, 'state', { get: () => state });
  Object.assign(H, {
    data: { LV, ROOMS, WALLS, HOLES, FLOORS, PAINTS, STYLES },
    on: (k, f) => { (subs[k] ||= new Set()).add(f); return () => subs[k].delete(f); },
    walker, setMode, toggleDoor,
    // setWalker({ x, z, l, yaw }) or setWalker(l, x, z, yaw)
    setWalker(a, x, z, yaw) { if (a && typeof a === 'object') placeWalker(a.l ?? walker.l, [a.x, a.z, a.yaw ?? 0]); else placeWalker(a, [x, z, yaw ?? 0]); },
    // [lowerLevel, x0, x1, zBottom, zTop, yBottom, yTop] (VR walks these; the desktop walk doesn't yet)
    stairs: [[0, 8.24, 9.0, 10.55, 8.3, 0, 2.76], [1, 8.2, 9.0, 8.3, 10.25, 2.76, 5.39], [0, 0, 0.92, 7.73, 5.8, 0, 2.76]],
    pickables: () => [...G.map(g => g.main), ...G.map(g => g.ceil), EXT].filter(o => shown(o)),
  });
  const bar = document.createElement('div'); bar.className = 'seg'; bar.id = 'toolSeg'; bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Gereedschap');
  $('#topbar').append(bar);
  let tt = 0; const toastEl = document.createElement('div');
  toastEl.style.cssText = 'position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;max-width:calc(100vw - 32px)';
  toastEl.hidden = true; toastEl.setAttribute('role', 'status'); $('#app').append(toastEl);
  H.ui = {
    addTool({ id, label, icon, onClick, title }) {
      const b = document.createElement('button'); b.type = 'button'; b.dataset.tool = id; b.setAttribute('aria-pressed', 'false'); if (title) b.title = title;
      b.innerHTML = (icon || '') + '<span style="margin-left:6px">' + label + '</span>'; b.style.display = 'inline-flex'; b.style.alignItems = 'center';
      b.onclick = e => onClick?.(e); bar.append(b); return b;
    },
    toast(t) { toastEl.textContent = t; toastEl.hidden = false; clearTimeout(tt); tt = setTimeout(() => { toastEl.hidden = true; }, 2600); },
  };
}

/* ================= BOOT + LOOP ================= */
buildArchitecture(); buildFixtures(); buildAllFurniture();
buildPanel(); syncPanel(); applyTime(state.time); setHint();
loadTextureSets(); loadSky();
function resize() { if (renderer.xr.isPresenting) return; const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
view = ROOM[state.sel].lvl; applyVisibility();
{ const t = viewTarget(view); orbit.target.copy(t); camera.position.copy(t).add(V(-8.5, 15.5, 14.5)); }
view = 0; setMode('walk'); // open walking, just inside the front door; the dollhouse is one tap away
const clock = new THREE.Clock(); let lastRoom = null, frames = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  updateDoors(dt);
  if (fly) { fly.k = Math.min(1, fly.k + dt / fly.dur); const e = fly.k < .5 ? 4 * fly.k ** 3 : 1 - (-2 * fly.k + 2) ** 3 / 2; camera.position.lerpVectors(fly.p0, fly.p1, e); orbit.target.lerpVectors(fly.t0, fly.t1, e); if (fly.k >= 1) fly = null; }

  if (mode === 'doll') {
    orbit.update();
    if (hover) { const h = pick(hover.x, hover.y, floorMeshes); if (h) { tag.hidden = false; tag.textContent = ROOM[h.object.userData.room].name; tag.style.left = hover.x + 'px'; tag.style.top = hover.y + 'px'; } else tag.hidden = true; hover = null; }
  } else {
    walkStep(dt);
    const r = roomAt(walker.l, walker.x, walker.z), rid = r?.id || null;
    if (rid !== lastRoom) { lastRoom = rid; if (r && r.id !== state.sel) selectRoom(r.id); const v = r ? r.lvl : (walker.l === 0 ? 'out' : walker.l); if (v !== view) { view = v; document.querySelectorAll('#floorSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.floor === String(view)))); } }
    const rect = cvs.getBoundingClientRect(), hd = pick(rect.left + rect.width / 2, rect.top + rect.height / 2, doorMeshes, 2.5);
    aimDoor = hd ? hd.object.userData.door : null;
    // door prompt sits under the crosshair; the room name lives in its own chip at the bottom so the view stays clean
    tag.hidden = !aimDoor;
    if (aimDoor) { tag.style.left = (rect.left + rect.width / 2) + 'px'; tag.style.top = (rect.top + rect.height / 2 + 6) + 'px'; tag.textContent = (COARSE ? 'Tik: deur ' : 'E: deur ') + (aimDoor.open ? 'sluiten' : 'openen'); }
    const rn = r ? r.name : walker.l === 0 ? 'Tuin' : '';

    roomTag.hidden = !rn;
  }
  if (flash) { flash.t += dt; const k = Math.max(0, 1 - flash.t / 0.9); flash.m.emissive.set('#3d7a66').multiplyScalar(0.35 * k); if (k <= 0) { flash.m.emissive.set(0); flash = null; } }
  for (const fn of tickFns) { try { fn(dt); } catch (e) { console.error(e); } }
  renderer.render(scene, camera);
  if (++frames === 2) $('#loading').hidden = true;
});

<script type="module">
// Logan & Gemma: loaded as a separate module so it can be swapped independently
import { addDalmatians, pet } from './dalmatians.js';
function boot() {
  const H = window.HOUSE;
  if (!H) return setTimeout(boot, 100);
  const T = H.THREE, home = new T.Group();
  H.addToRoom('woonkamer', home);
  const dogs = addDalmatians(T, home, { onTick: H.onTick });
  H.dogs = dogs;
  const ray = new T.Raycaster(), p = new T.Vector2();
  let down = null;
  H.renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  H.renderer.domElement.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
    const r = H.renderer.domElement.getBoundingClientRect();
    if (document.pointerLockElement) p.set(0, 0);
    else p.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(p, H.camera);
    const hit = ray.intersectObjects(dogs.dogs.map(d => d.group), true)[0];
    if (hit && hit.distance < 30) pet(hit.object);
  });
}
boot();
</script>
